http:
  address: ":8080"
  read_header_timeout: 5s
  # Whole request, including image uploads up to images.max_size_bytes
  read_timeout: 60s
  write_timeout: 60s
  # Browser origins allowed to call the API (the Flutter web app).
  # Override with CORS_ALLOWED_ORIGINS=https://a.example,https://b.example
  cors_allowed_origins:
    - "http://localhost:*"
    - "http://127.0.0.1:*"
  idle_timeout: 60s

log:
  level: "debug"

db:
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m
  conn_max_idle_time: 5m

auth:
  access_ttl: 15m
  refresh_ttl: 168h
  issuer: "rental-platform"
  audience: "rental-platform-api"

seed_user:
  email: "owner@rental.test"
  full_name: "Rental Owner"

verification:
  ttl: 15m
  resend_interval: 60s
  max_attempts: 5
  public_base_url: "http://localhost:8080"

smtp:
  enabled: false
  host: "smtp.yandex.ru"
  port: 465
  tls_mode: "tls"
  from_name: "Rental Platform"
  timeout: 5s

# Deletion of expired or revoked refresh sessions and expired email verifications
cleanup:
  interval: 1h
  retention: 24h

# Listing photos in S3-compatible storage. Credentials come from .env
storage:
  endpoint: "localhost:8333"
  region: "us-east-1"
  bucket: "listing-images"
  use_ssl: false

images:
  max_size_bytes: 5242880 # 5 MiB
  max_per_listing: 10
  max_dimension: 8000 # pixels, for width and height
