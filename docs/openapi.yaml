openapi: 3.0.3
info:
  title: Rental Platform API
  version: 0.5.0
  description: |
    API аренды недвижимости: регистрация, подтверждение почты и JWT-авторизация.

    **Как проверить в Swagger:**
    1. Настройте SMTP и выполните `POST /auth/register` с вашей настоящей почтой.
    2. Подтвердите почту кодом через `POST /auth/verify-email` или ссылкой из письма.
    3. Выполните `POST /auth/login`. Swagger автоматически подставит access-токен
       в защищённые запросы. Можно также вставить его вручную через **Authorize**.
    4. При обновлении токенов сохраните новый `refresh_token`.

    Созданный через `cmd/seed-user` пользователь уже подтверждён.
    Ошибки возвращаются как JSON с полем `error`.
servers:
  - url: /
    description: Текущий сервер
tags:
  - name: Registration
    description: Регистрация и подтверждение почты
  - name: Auth
    description: Вход, refresh-сессии и текущий пользователь
  - name: Listings
    description: Объявления об аренде. Публично видны только опубликованные.
  - name: My listings
    description: Объявления текущего пользователя в любом статусе
  - name: Images
    description: Фотографии объявлений
paths:
  /auth/register:
    post:
      tags: [Registration]
      operationId: register
      summary: Зарегистрировать пользователя
      description: |
        Создаёт пользователя с ролью `user` и отправляет одно письмо с кодом и
        магической ссылкой. До подтверждения почты войти нельзя.
        Если отправка не удалась после создания аккаунта, запросите повторное
        письмо через `/auth/verification/resend`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Пользователь создан, письмо принято SMTP-сервером
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
              example:
                email: user@yandex.ru
                message: Check your email to verify your account.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Почта уже зарегистрирована
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/MailUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verification/resend:
    post:
      tags: [Registration]
      operationId: resendVerification
      summary: Повторно отправить письмо подтверждения
      description: |
        Отправляет новый код и ссылку, отменяя предыдущие. По умолчанию повторная
        отправка разрешена через 60 секунд. Для неизвестной или уже подтверждённой
        почты возвращается такой же ответ, но письмо не отправляется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '202':
          description: Запрос обработан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          description: Письмо уже отправлено недавно
          headers:
            Retry-After:
              description: Сколько секунд ждать перед повторной отправкой
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/MailUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/verify-email:
    post:
      tags: [Registration]
      operationId: verifyEmail
      summary: Подтвердить почту кодом или токеном из ссылки
      description: |
        Передайте **либо** `email` и шестизначный `code`, **либо** один `token`.
        Код и ссылка действуют 15 минут и одноразовые: подтверждение одним способом
        отменяет другой. После 5 неверных кодов нужно запросить новое письмо.
        После успеха выполните `/auth/login` для получения JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/VerifyCodeInput'
                - $ref: '#/components/schemas/VerifyTokenInput'
            examples:
              code:
                summary: Код из письма
                value:
                  email: user@yandex.ru
                  code: '123456'
              magicLink:
                summary: Токен из фрагмента магической ссылки
                value:
                  token: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      responses:
        '200':
          description: Почта подтверждена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              example:
                message: Email verified. You can now log in.
        '400':
          description: Неверный формат, неверный, истёкший или уже использованный код/токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Registration]
      operationId: verificationPage
      summary: Страница подтверждения из письма
      description: |
        HTML-страница автоматически подтверждает токен из фрагмента
        `/auth/verify-email#token=...`, отправляя POST-запрос. Фрагмент не попадает
        в HTTP-запрос или access-логи. GET сам по себе не меняет состояние аккаунта.
        Без токена отображается форма для ввода почты и кода.
      responses:
        '200':
          description: HTML-страница
          content:
            text/html:
              schema:
                type: string
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Войти по почте и паролю
      description: |
        Почта без учёта регистра, пароль с учётом регистра и пробелов.
        Создаёт отдельную сессию. Access действует 15 минут, refresh — 7 дней.
        Swagger автоматически использует access-токен успешного ответа.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          $ref: '#/components/responses/Tokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Неверная почта или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: invalid email or password
        '403':
          description: Почта ещё не подтверждена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: verify your email before logging in
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: Обновить оба токена
      description: |
        Требуется только refresh-токен. Работает после истечения access-токена.
        Сохраните оба новых токена. Старый refresh использовать повторно нельзя:
        повтор отзывает всю сессию. Не отправляйте параллельные refresh-запросы.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '200':
          $ref: '#/components/responses/Tokens'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Завершить текущую сессию
      description: |
        Отзывает access и refresh этой сессии. Другие сессии продолжают работать.
        Повторный выход с тем же ещё не истёкшим refresh также возвращает 204.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshInput'
      responses:
        '204':
          description: Сессия завершена, тело отсутствует
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      summary: Получить текущего пользователя
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Текущий пользователь, без хеша пароля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /listings:
    get:
      tags: [Listings]
      operationId: listListings
      summary: Получить ленту опубликованных объявлений
      description: |
        Доступно без авторизации. Возвращает только объявления со статусом
        `published`, новые первыми (id DESC). Следующая страница — запрос с
        `cursor` = `next_cursor` из предыдущего ответа.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ListingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Listings]
      operationId: createListing
      summary: Создать своё объявление
      description: owner_id определяется по текущему пользователю.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/Listing'
      responses:
        '201':
          description: Объявление создано
          headers:
            Location:
              description: Путь созданного объявления
              schema:
                type: string
                example: /listings/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Listing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /listings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID объявления
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [Listings]
      operationId: getListing
      summary: Получить опубликованное объявление
      description: Черновики и архивные объявления недоступны и возвращают 404.
      responses:
        '200':
          $ref: '#/components/responses/Listing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/ListingNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Listings]
      operationId: updateListing
      summary: Полностью заменить своё объявление
      description: |
        Нужно передать все обязательные поля. Пропущенные необязательные поля
        сбрасываются в null или значения по умолчанию. Владельца менять нельзя.
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/Listing'
      responses:
        '200':
          $ref: '#/components/responses/Listing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForeignListing'
        '404':
          $ref: '#/components/responses/ListingNotFound'
        '413':
          $ref: '#/components/responses/BodyTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Listings]
      operationId: deleteListing
      summary: Удалить своё объявление
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Объявление удалено, тело отсутствует
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForeignListing'
        '404':
          $ref: '#/components/responses/ListingNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /listings/{id}/images:
    parameters:
      - name: id
        in: path
        required: true
        description: ID объявления
        schema:
          type: integer
          format: int64
          minimum: 1
    post:
      tags: [Images]
      operationId: uploadListingImage
      summary: Загрузить фото к своему объявлению
      description: |
        `multipart/form-data` с одним файлом в поле `image`. Допустимы JPEG, PNG
        и WebP: тип определяется по содержимому файла, а не по расширению.
        Ограничения по умолчанию: до 5 МиБ, до 10 фото на объявление, стороны
        не больше 8000 px. Новое фото добавляется в конец; первое фото — обложка.
        Порядок меняется через `PUT /listings/{id}/images/order`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '201':
          description: Фото загружено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListingImage'
        '400':
          description: Нет поля image, лишние поля, повреждённый файл или слишком большие размеры в пикселях
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForeignListing'
        '404':
          $ref: '#/components/responses/ListingNotFound'
        '409':
          description: У объявления уже максимальное количество фото
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Файл больше допустимого размера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Тело не multipart/form-data или файл не JPEG, PNG или WebP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /listings/{id}/images/order:
    parameters:
      - name: id
        in: path
        required: true
        description: ID объявления
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [Images]
      operationId: reorderListingImages
      summary: Изменить порядок фото своего объявления
      description: |
        Передайте ID всех фото объявления в нужном порядке, каждый ровно один раз.
        Первое фото становится обложкой. Неполный список, чужие или повторяющиеся
        ID отклоняются с 400, порядок при этом не меняется.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image_ids]
              properties:
                image_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    type: integer
                    format: int64
                    minimum: 1
            example:
              image_ids: [3, 1, 2]
      responses:
        '200':
          description: Фото в новом порядке
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ListingImage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForeignListing'
        '404':
          $ref: '#/components/responses/ListingNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '500':
          $ref: '#/components/responses/InternalError'
  /listings/{id}/images/{imageID}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID объявления
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: imageID
        in: path
        required: true
        description: ID фото
        schema:
          type: integer
          format: int64
          minimum: 1
    delete:
      tags: [Images]
      operationId: deleteListingImage
      summary: Удалить фото своего объявления
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Фото удалено вместе с файлом
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForeignListing'
        '404':
          description: Объявление или фото не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /images/{key}:
    get:
      tags: [Images]
      operationId: getImage
      summary: Получить файл фото
      description: |
        Используйте `url` из объекта фото. Имя файла случайное и не меняется,
        поэтому ответ кешируется на год. Ссылки на фото черновиков видит только автор.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: '^[0-9a-f]{32}\.(jpg|png|webp)$'
      responses:
        '200':
          description: Файл изображения
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: Фото не найдено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/listings:
    get:
      tags: [My listings]
      operationId: listOwnListings
      summary: Мои объявления
      description: |
        Все объявления текущего пользователя: черновики, опубликованные и архивные.
        Новые первыми (id DESC), пагинация как у `GET /listings`.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Показать только объявления с этим статусом
          schema:
            type: string
            enum: [draft, published, archived]
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          $ref: '#/components/responses/ListingPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /me/listings/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: ID объявления
        schema:
          type: integer
          format: int64
          minimum: 1
    get:
      tags: [My listings]
      operationId: getOwnListing
      summary: Моё объявление в любом статусе
      description: Чужие объявления возвращают 404.
      security:
        - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/Listing'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ListingNotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Количество объявлений на странице
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Значение `next_cursor` из предыдущей страницы. Не передавайте для первой страницы.
      schema:
        type: integer
        format: int64
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access-токен из login или refresh. Вставляйте сам токен, без слова Bearer.
  requestBodies:
    Listing:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListingInput'
          example:
            title: Уютный загородный дом
            description: Дом с террасой и видом на лес
            property_type: cottage
            price_minor: 750000
            currency: RUB
            price_period: day
            country: Россия
            city: Истра
            region: Московская область
            address: ул. Лесная, д. 15
            area_sqm: 120.5
            bedrooms: 3
            bathrooms: 2
            max_guests: 6
            status: published
  responses:
    Tokens:
      description: Новая пара токенов, ответ не кешируется
      headers:
        Cache-Control:
          schema:
            type: string
            example: no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenPair'
    ListingPage:
      description: Страница объявлений
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ListingPage'
    Listing:
      description: Объявление
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Listing'
    BadRequest:
      description: Некорректные данные запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Нужен действующий токен; токен неверен, истёк или отозван
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForeignListing:
      description: Объявление принадлежит другому пользователю
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ListingNotFound:
      description: Объявление не найдено
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BodyTooLarge:
      description: Тело запроса превышает 1 МиБ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: Content-Type должен быть application/json
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MailUnavailable:
      description: SMTP не настроен или письмо не удалось отправить
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          example: invalid email or password
    Message:
      type: object
      required: [message]
      properties:
        message:
          type: string
    RegistrationResponse:
      type: object
      required: [email, message]
      properties:
        email:
          type: string
          format: email
        message:
          type: string
    RegisterInput:
      type: object
      additionalProperties: false
      required: [email, password, full_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: user@yandex.ru
        password:
          type: string
          format: password
          maxLength: 72
          description: От 8 до 72 байт UTF-8. Пробелы сохраняются.
          example: MyStrongPassword123!
        full_name:
          type: string
          minLength: 1
          maxLength: 150
          example: Анна Иванова
    EmailInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          example: user@yandex.ru
    VerifyCodeInput:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          pattern: '^[0-9]{6}$'
          description: Строка из 6 цифр, включая ведущие нули
    VerifyTokenInput:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Значение token из фрагмента ссылки в письме
    LoginInput:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: owner@rental.test
        password:
          type: string
          format: password
          maxLength: 72
          example: replace-with-your-password
    RefreshInput:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
          description: Последний полученный refresh-токен
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, access_expires_at, refresh_expires_at]
      properties:
        access_token:
          type: string
          description: JWT для Bearer-авторизации
        refresh_token:
          type: string
          description: Одноразовый JWT для обновления сессии
        token_type:
          type: string
          enum: [Bearer]
        access_expires_at:
          type: string
          format: date-time
        refresh_expires_at:
          type: string
          format: date-time
    User:
      type: object
      required: [id, email, full_name, role, email_verified, email_verified_at, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        full_name:
          type: string
        role:
          type: string
          enum: [user, admin]
        email_verified:
          type: boolean
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ListingInput:
      type: object
      required: [title, description, property_type, price_minor, city]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
        property_type:
          type: string
          enum: [house, cottage, dacha, apartment]
        price_minor:
          type: integer
          format: int64
          minimum: 1
          description: Минимальные единицы валюты. 750000 = 7500.00 RUB.
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          default: RUB
        price_period:
          type: string
          enum: [day, month]
          default: day
        country:
          type: string
          maxLength: 100
          default: Россия
        region:
          type: string
          maxLength: 150
          nullable: true
        city:
          type: string
          minLength: 1
          maxLength: 150
        address:
          type: string
          nullable: true
        area_sqm:
          type: number
          minimum: 0.01
          maximum: 999999.99
          nullable: true
          description: Площадь, PostgreSQL сохраняет 2 знака после запятой
        bedrooms:
          type: integer
          minimum: 0
          maximum: 32767
          nullable: true
        bathrooms:
          type: integer
          minimum: 0
          maximum: 32767
          nullable: true
        max_guests:
          type: integer
          minimum: 1
          maximum: 32767
          nullable: true
        status:
          type: string
          enum: [draft, published, archived]
          default: draft
          description: Публично видны только объявления со статусом published.
    Listing:
      allOf:
        - $ref: '#/components/schemas/ListingInput'
        - type: object
          required: [id, owner_id, published_at, images, created_at, updated_at]
          properties:
            id:
              type: integer
              format: int64
              readOnly: true
            owner_id:
              type: integer
              format: int64
              readOnly: true
              description: Автор объявления, определяется по токену
            published_at:
              type: string
              format: date-time
              nullable: true
              readOnly: true
              description: |
                Устанавливается сервером при переходе в статус published,
                сохраняется, пока объявление опубликовано, и сбрасывается в null
                при переводе в draft или archived.
            images:
              type: array
              readOnly: true
              description: Фото по position, первое — обложка
              items:
                $ref: '#/components/schemas/ListingImage'
            created_at:
              type: string
              format: date-time
              readOnly: true
            updated_at:
              type: string
              format: date-time
              readOnly: true
    ListingPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Listing'
        next_cursor:
          type: integer
          format: int64
          nullable: true
          description: Передайте в параметр cursor для следующей страницы; null — страниц больше нет.
    ListingImage:
      type: object
      required: [id, url, content_type, size_bytes, width, height, position, created_at]
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          description: Путь к файлу на этом сервере
          example: /images/5d7c1746e90d9bae59b46b8cbac9b71b.jpg
        content_type:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
        height:
          type: integer
        position:
          type: integer
          description: Порядок фото в объявлении, по возрастанию
        created_at:
          type: string
          format: date-time
