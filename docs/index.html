<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rental Platform API</title>
  <link rel="stylesheet" href="./swagger-ui.css">
  <style>body { margin: 0; background: #fafbf9; } .swagger-ui .topbar { display: none; }</style>
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="./swagger-ui-bundle.js"></script>
  <script src="./swagger-ui-standalone-preset.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: '/openapi.yaml',
      dom_id: '#swagger-ui',
      deepLinking: true,
      displayRequestDuration: true,
      defaultModelsExpandDepth: -1,
      persistAuthorization: false,
      validatorUrl: null,
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
      layout: 'BaseLayout',
      responseInterceptor: response => {
        if (response.status === 200 && /\/auth\/(login|refresh)(?:\?|$)/.test(response.url)) {
          const body = typeof response.body === 'string' ? JSON.parse(response.body) : response.body;
          if (body && body.access_token) window.ui.preauthorizeApiKey('bearerAuth', body.access_token);
        }
        return response;
      }
    });
  </script>
</body>
</html>
