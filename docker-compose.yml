services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 5

  # S3-compatible storage for listing photos (free, data stays on this machine).
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    command: >-
      server -ip.bind=0.0.0.0 -dir=/data
      -s3 -s3.port=8333
      -master.volumeSizeLimitMB=64 -volume.max=0

    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}

    ports:
      - 127.0.0.1:${S3_PORT:-8333}:8333

    volumes:
      - seaweedfs_data:/data

    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8333/healthz
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 60s

volumes:
  postgres_data:
  seaweedfs_data:
